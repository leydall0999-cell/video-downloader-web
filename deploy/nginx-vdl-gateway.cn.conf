# VDL 网关分流：安全组只放行 8888，所以网关不能另起端口，只能在 8888 上按路径分流。
#   /gw/  → 127.0.0.1:8890  (vdl-gateway)
#   /su   → 127.0.0.1:8901  (vdl-share 大文件直连上传通道，2026-09-20 新增)
#   /s/   → 127.0.0.1:8901  (vdl-share 分享页，默认 server 兜底，2026-09-20 新增)
#   /f/   → nginx 直出        (分享文件字节，默认 server 兜底，2026-09-20 新增)
#   /     → 127.0.0.1:18890 (vdl-web，原监听 0.0.0.0:8888，已改为本机端口)
#
# 本文件是 VPS /etc/nginx/sites-enabled/vdl-gateway 的版本化副本，改动请同步。
# ⚠️ 2026-09-29 起本副本**正式入库**（deploy/nginx-vdl-gateway.cn.conf）：此前 VPS 上那份
#    没有版本化副本，改了也没人知道，直接导致下面这个事故——
#    域名 2026-09-26 切到 CF 命名隧道后回源到本 default_server，而 server 级
#    client_max_body_size 只有 8m；网页版所有大文件上传（格式转换 / 视频拼接 /
#    音乐转换 / 字幕识别）都走 /api/upload-chunk、前端每片 32MB
#    ⇒ 每一片都被 nginx 在到达应用前 413 掉，整条上传链路全废
#    （用户可见：「分片 2/8 上传失败：分片上传失败 HTTP 413」）。
#    改完必须：`nginx -t` → reload → 用 33MB 分片实测 200（见 server/tests/test_upload_body_limit.py）。
server {
    listen 8888 default_server;
    server_name _;

    # ---- 传输压缩（2026-11-01 新增，解决「加载速度好慢」）----
    # 背景：nginx.conf 的 http 块里只有裸 `gzip on;`，而 gzip_types 那几行**全是注释**，
    #   所以实际只压 text/html —— JS / CSS / JSON 全部裸奔。
    # 为什么要命：域名走 CF 命名隧道，CF 免费版把国内访客路由到美西（ping 221ms，
    #   而直连源站只要 29ms）。CF 边缘缓存 MISS 时必须跨洋回源拉原始文件：
    #   app.js 599KB、首页 HTML 156KB。实测 gzip 后分别只剩 169KB / 40KB。
    # 注：CF 命中缓存后走它自己的压缩，这一份只影响回源段，但回源正是最慢的一段。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml application/rss+xml application/wasm
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # 体积上限统一放宽到应用自己的总上限（VDL_UPLOAD_MAX_BYTES 默认 1GB）。
    # 原来这里是 8m —— 对「整文件上传」类端点（/api/commentary、/api/convert、
    # /api/dewatermark）一样是硬伤，只是网页版目前都走分片端点、没暴露出来。
    # 收口方式：分片端点单独用 location 放宽到 2048m 并**流式转发**（见下）；
    # 其余保留 1GB 兜底，避免再出现「某个端点悄悄 413」。
    client_max_body_size 1024m;
    client_body_timeout 600s;

    # 静态分发目录：Windows 安装包等大文件直连下载（绕 CF，2026-10-26）
    location ^~ /dist/ {
        alias /opt/vdl-worker/dist/;
        autoindex off;
        add_header Accept-Ranges bytes;
    }

    # 网关：SSE 流式必须关掉缓冲，否则 stream=True 会被攒到结束才吐
    location /gw/ {
        # LLM 网关只发小 JSON，保持较紧的体积上限（原来靠 server 级 8m 兜着，
        # server 级放宽后必须显式写回，否则等于顺手放开攻击面）
        client_max_body_size 128m;   # 抠图要传图（原 16m 不够）
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ---- 网页版分片上传（2026-09-29 新增，修「分片 N/8 上传失败 HTTP 413」）----
    # 覆盖 /api/upload-chunk 及其子路径：/finish（合并+提交转码）、/abort（取消）。
    # 用 ^~ 前缀匹配：优先于下方所有正则 location（^/api/share/... 等不会撞上）。
    # 前端每片 32MB（>2GB 文件 64MB），后端单块上限也是 64MB（app.UPLOAD_CHUNK_MAX）。
    # proxy_request_buffering off：32MB 先落临时盘再转发会白白翻倍磁盘 I/O，
    #   应用本身是流式读（每次 1MB）落分片文件，直通最省。
    location ^~ /api/upload-chunk {
        client_max_body_size 2048m;
        client_body_timeout 1800s;
        proxy_pass http://127.0.0.1:18890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---- 扫码分享：大文件直连上传通道 ----
    # 存在的唯一理由：Cloudflare 免费版请求体上限 100MB，更大的文件必须绕开 CF
    # 直连源站（桌面端按体积自动选路，见 server/routers/share.py 的 cf_body_limit）。
    # 用精确匹配 = /su，避免误吞 /s/ 等前缀。
    # 代价：该通道是明文 HTTP，文件走的路径不经 CF 加密。
    location = /su {
        client_max_body_size 2048m;
        client_body_timeout 1800s;
        proxy_pass http://127.0.0.1:8901/api/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---- 扫码分享：域名上传通道（2026-09-26 新增）----
    # 为什么需要：base 通道的上传端点就是 <base>/api/upload。此前公网 base 指向 CF
    # 临时隧道（随机域，回落到本 default_server），而本 block 故意未放行 /api/upload
    # （/api/ 其余归网页版 18890）⇒ 该通道**长期 405**，桌面端每次都静默回落明文直连通道。
    # 2026-09-26 公网 base 改为主域 hanyuxz.top 后补上本条，使 ≤100MB 文件走 CF（HTTPS）。
    # ⚠️ 必须**精确匹配** = /api/upload，绝不能写成前缀，否则会劫持网页版的 /api/*。
    # ⚠️ 已实测：网页版 18890 的 openapi.json 无 /api/upload，本条不覆盖任何已有端点。
    location = /api/upload {
        client_max_body_size 2048m;
        client_body_timeout 1800s;
        proxy_pass http://127.0.0.1:8901/api/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传必须流式转发：否则 nginx 先把整份文件写临时盘，1.6GB 内存的机器扛不住
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---- 扫码分享：删除接口（2026-09-21 新增）----
    # 为什么需要单独放行：桌面端只有 `location = /su` 一条直连通道（精确匹配，只能「上传」），
    # 而 DELETE /api/share/<sid> 原先只在 share.<域> 的 server block 里有转发 ——
    # 正式域名 DNS 未就绪时，这个接口从公网**完全不可达**（实测隧道/IP 入口均 404），
    # 导致「删除分享」在桌面端无法实现。
    # ⚠️ 只放行这一条精确子路径：本 block 的其余 /api/* 属于网页版(18890)，绝不能整段接管
    #    （网页版对 /api/share/* 实测返回 404，故本条不会劫持它）。
    # ⚠️ 故意**不**放行 /api/meta/<sid>：它返回的 meta 含上传者 IP，放开等于重开泄漏口
    #    （同 /f/<sid>/meta.json，见下面那条 404 规则）。
    # ⚠️ 正则必须**整体加引号**：nginx 配置解析器会把未加引号的 `{` 当成块起始，
    #    写成 location ~ ^/api/share/[A-Za-z0-9_-]{6,32}$ 会报
    #    `unknown directive "6,32}$"`（2026-09-21 实测踩到，reload 直接失败）。
    location ~ "^/api/share/[A-Za-z0-9_-]{6,32}$" {
        proxy_pass http://127.0.0.1:8901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- 扫码分享：分享页兜底（2026-09-20 新增）----
    # 为什么默认 server 也要有：临时隧道（cloudflared quick tunnel）回源的 Host
    # 是随机域名，不匹配 share.hanyuxz.top，会落到这里；也兼容用 IP:8888 直连预览。
    # 注意：这里**不能**包含 api/ —— 默认 server 的 /api/ 属于网页版(18890)，加进来会打坏它。
    location ~ ^/(s/|healthz) {
        proxy_pass http://127.0.0.1:8901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- 扫码分享：隐藏内部文件 ----
    # ⚠️ 2026-09-21 修补：这条原先只写在 nginx-vdl-share.conf（share.<域> 那个 block）里，
    #    而临时隧道 / IP 直连都会落到本 default_server —— 于是 /f/<sid>/meta.json 敞开，
    #    泄漏上传者 IP 与存储名（实测 200 + "ip":"223.104.86.81"）。两个 block 必须成对存在。
    #    正则 location 优先于 /f/ 前缀 location，故此处 return 404 生效。
    location ~ ^/f/.*(\.uploading|meta\.json)$ {
        return 404;
    }

    # ---- 扫码分享：文件字节（nginx 直出，原生 Range）----
    location /f/ {
        alias /opt/vdl-share/data/;
        autoindex off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=604800" always;
        limit_except GET HEAD { deny all; }
    }

    # VDL 授权中心（账号/卡密/会员权益真源）— 2026-09-22 自香港迁入
    # ^~ 前缀匹配，优先于下方正则 location；license_server 监听 127.0.0.1:8902
    location ^~ /api/license/ {
        proxy_pass http://127.0.0.1:8902;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---- 后台 / 运维页 HTML：禁止浏览器缓存（2026-11-01）----
    # 为什么必须单独一条：这两个页面不走版本号，是改完直接热更的 HTML。
    # 之前响应里没有 Cache-Control，浏览器就按 Last-Modified 做启发式缓存（约文件年龄的 10%），
    # 结果线上文件已经更新、用户打开仍是旧界面（实测：运维页 KPI 还显示旧版「总请求」）。
    # 只作用于 /admin/ 与 /ops/ 下的 HTML；/app.js 等静态资源仍走原策略，
    # 不然每次刷新都要重拉 600KB 脚本。
    location ~ ^/(admin|ops)/ {
        proxy_pass http://127.0.0.1:18890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_buffering off;
    }

    # 原有服务原样透传
    location / {
        proxy_pass http://127.0.0.1:18890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
